name: Daily AI News

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without publishing'
        required: false
        default: true
        type: boolean
      verify_adobe:
        description: 'Verify Adobe OAuth and list tagged documents'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read

jobs:
  daily-content:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      ADOBE_CLIENT_ID: ${{ secrets.ADOBE_CLIENT_ID }}
      ADOBE_CLIENT_SECRET: ${{ secrets.ADOBE_CLIENT_SECRET }}
      ADOBE_SCOPE: ${{ vars.ADOBE_SCOPE }}
      ADOBE_TEMPLATE_ID: ${{ secrets.ADOBE_TEMPLATE_ID }}

      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_API_VERSION: 'v24.0'

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: 'private'

      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Verify Adobe Express connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_adobe }}
        run: npm run verify-adobe

      - name: Generate daily editorial package
        run: npm run run

      - uses: actions/upload-artifact@v4
        with:
          name: daily-ai-news
          path: artifacts/
