name: Daily AI News

on:
  workflow_dispatch:
    inputs:
      render_carousel:
        description: 'Render the 7-slide HTML/CSS carousel'
        required: false
        default: true
        type: boolean
      publish_instagram:
        description: 'Publish carousel to Instagram'
        required: false
        default: false
        type: boolean
  schedule:
    # Daily production run at 08:05 IST = 02:35 UTC.
    # Five minutes past the hour reduces the chance of GitHub scheduler
    # congestion/dropped runs compared with an exact top-of-hour schedule.
    - cron: '35 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  daily-content:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Primary: requested Gemini 3.8 Flash. The application has a multi-model
      # cascade for temporary capacity failures.
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_FALLBACK_MODELS: gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite

      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_API_VERSION: 'v26.0'
      PUBLIC_ASSET_BASE_URL: ${{ vars.PUBLIC_ASSET_BASE_URL }}

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: 'private'

      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
      RENDER_CAROUSEL: ${{ github.event_name == 'workflow_dispatch' && inputs.render_carousel || 'true' }}
      PUBLISH_INSTAGRAM: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_instagram || 'false') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate editorial package and carousel
        env:
          PUBLISH_INSTAGRAM: 'false'
        run: npm run run

      - name: Prepare GitHub Pages assets
        run: |
          rm -rf pages-site
          mkdir -p pages-site/carousel
          cp artifacts/carousel/slide-*.jpg pages-site/carousel/
          cat > pages-site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Everyday AI Desk</title>
          </head>
          <body>
            <h1>Everyday AI Desk</h1>
            <p>Daily AI carousel assets.</p>
          </body>
          </html>
          HTML

      - uses: actions/upload-artifact@v4
        with:
          name: daily-ai-news
          path: artifacts/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish carousel to Instagram after Pages deployment
        if: env.PUBLISH_INSTAGRAM == 'true'
        run: npm run publish-instagram
