name: Daily AI News

on:
  workflow_dispatch:
    inputs:
      render_carousel:
        description: 'Render the 7-slide HTML/CSS carousel'
        required: false
        default: true
        type: boolean
      publish_instagram:
        description: 'Publish carousel to Instagram'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read

jobs:
  daily-content:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash

      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_API_VERSION: 'v24.0'
      PUBLIC_ASSET_BASE_URL: ${{ vars.PUBLIC_ASSET_BASE_URL }}

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: 'private'

      DRY_RUN: 'true'
      RENDER_CAROUSEL: ${{ github.event_name == 'workflow_dispatch' && inputs.render_carousel || 'true' }}
      PUBLISH_INSTAGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_instagram || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate editorial package and carousel
        run: npm run run

      - uses: actions/upload-artifact@v4
        with:
          name: daily-ai-news
          path: artifacts/
